sources:
  # One repo, two doc sets: each folder has its own docs.json and its own URL prefix
  - repo: chitalian/multirepo-test-api
    path: docs
    destination: api
    name: API reference
  - repo: chitalian/multirepo-test-api
    path: docs_2
    destination: api-ops
    name: API operations
  - repo: chitalian/multirepo-test-sdk
    destination: sdk
    name: SDK
    exclude: [README.md, "src/**", package.json, package-lock.json, tsconfig.json]
