name: Diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          T: ${{ secrets.DOCS_TOKEN }}
        run: |
          echo "token length: ${#T}"
          echo "prefix: ${T:0:11}" | sed 's/\(github_pat_\).*/\1/'
          for r in multirepo-test-api multirepo-test-sdk; do
            printf "$r api: "; curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $T" https://api.github.com/repos/chitalian/$r
          done
          git config --show-origin --get-regexp 'http.*' || true
          env | grep -E '^GIT_' | cut -d= -f1 || true
          H=$(printf 'x-access-token:%s' "$T" | base64 -w0)
          GIT_TERMINAL_PROMPT=0 git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $H" ls-remote https://github.com/chitalian/multirepo-test-api.git HEAD >/dev/null && echo "ls-remote ok" || echo "ls-remote failed"
