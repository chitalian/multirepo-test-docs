name: Combine docs

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [pull-request, push, none]
        default: push
  repository_dispatch:
    types: [docs-updated]

concurrency:
  group: mintlify-multirepo
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: sync
        # Pinned to mintlify/multirepo-action#12 for destination sourceRefs. Switch back to @v1 once it's released
        uses: mintlify/multirepo-action@justin/sourceref-destination
        with:
          token: ${{ secrets.DOCS_TOKEN }}
          mode: ${{ inputs.mode || 'push' }}
      - run: echo "changed=${{ steps.sync.outputs.changed }} sha=${{ steps.sync.outputs.commit-sha }} pr=${{ steps.sync.outputs.pull-request-url }}"
