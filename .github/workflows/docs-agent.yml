name: Docs agent

on:
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
    inputs:
      repo:
        description: Child repo that changed, e.g. chitalian/multirepo-test-api
        required: true
      before:
        description: Commit before the change (blank for the parent of "after")
        required: false
      after:
        description: Commit after the change
        required: true

concurrency:
  group: docs-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Act as the "Docs agent" GitHub App when it's configured, so PRs and commits show the bot, not a person
      - id: app
        if: vars.DOCS_AGENT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOCS_AGENT_APP_ID }}
          private-key: ${{ secrets.DOCS_AGENT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: bot
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Update docs across repos
        env:
          REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          BEFORE: ${{ github.event.client_payload.before || inputs.before }}
          AFTER: ${{ github.event.client_payload.after || inputs.after }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.DOCS_TOKEN }}
          AGENT_NAME: ${{ steps.bot.outputs.name || 'Docs agent' }}
          AGENT_EMAIL: ${{ steps.bot.outputs.email || 'docs-agent@users.noreply.github.com' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$REPO" ] || [ -z "$AFTER" ]; then echo "No repo in the dispatch payload. Skipping."; exit 0; fi
          .github/docs-agent/run.sh
